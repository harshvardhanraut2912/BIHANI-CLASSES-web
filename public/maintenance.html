<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Under Maintenance - Y N Classes</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0d12;
    color: #eef1f7;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    overflow: hidden;
  }
  .wrap {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    position: relative;
  }

  .scene {
    width: min(420px, 80vw);
    margin-bottom: 8px;
  }
  .scene svg { width: 100%; height: auto; display: block; }

  /* subtle crane arm sway */
  .crane-arm {
    transform-origin: 301px 52px;
    animation: sway 5s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(0.6deg); }
  }

  /* hook + beam gently lowering/raising */
  .hook-group {
    animation: hoist 4.5s ease-in-out infinite;
  }
  @keyframes hoist {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(6px); }
  }

  /* blinking warning light on crane */
  .beacon {
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  /* dust puffs at the base */
  .dust circle {
    animation: puff 3s ease-in infinite;
  }
  .dust circle:nth-child(2) { animation-delay: 1s; }
  .dust circle:nth-child(3) { animation-delay: 2s; }
  @keyframes puff {
    0%   { opacity: 0; transform: translateY(0) scale(0.6); }
    15%  { opacity: 0.35; }
    100% { opacity: 0; transform: translateY(-18px) scale(1.4); }
  }

  h1 {
    font-size: clamp(20px, 3.4vw, 28px);
    margin: 4px 0 10px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  p {
    max-width: 460px;
    margin: 0 auto;
    color: #9aa1b0;
    font-size: 15px;
    line-height: 1.65;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 22px;
    padding: 7px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 12.5px;
    color: #b7bdc9;
    letter-spacing: 0.3px;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #f2b13b;
    box-shadow: 0 0 0 0 rgba(242,177,59,0.6);
    animation: pulseDot 1.8s infinite;
  }
  @keyframes pulseDot {
    0%   { box-shadow: 0 0 0 0 rgba(242,177,59,0.5); }
    70%  { box-shadow: 0 0 0 7px rgba(242,177,59,0); }
    100% { box-shadow: 0 0 0 0 rgba(242,177,59,0); }
  }

  .footer {
    position: absolute;
    bottom: 22px;
    font-size: 12px;
    color: #565d6d;
    letter-spacing: 0.4px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="scene">
      <svg viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg">
        <!-- ground -->
        <rect x="0" y="228" width="420" height="2" fill="#232733"/>

        <!-- dust puffs -->
        <g class="dust" fill="#3a4152">
          <circle cx="150" cy="224" r="5"/>
          <circle cx="172" cy="226" r="4"/>
          <circle cx="188" cy="222" r="6"/>
        </g>

        <!-- unfinished building (broken / partial structure) -->
        <g stroke="#2b3140" stroke-width="2" fill="none">
          <!-- left completed section -->
          <rect x="40" y="120" width="90" height="108" fill="#151924" stroke="#2b3140"/>
          <line x1="40" y1="148" x2="130" y2="148"/>
          <line x1="40" y1="176" x2="130" y2="176"/>
          <line x1="40" y1="204" x2="130" y2="204"/>
          <line x1="68" y1="120" x2="68" y2="228"/>
          <line x1="96" y1="120" x2="96" y2="228"/>
          <!-- windows lit dim -->
          <rect x="50" y="156" width="12" height="14" fill="#232a3a" stroke="none"/>
          <rect x="106" y="156" width="12" height="14" fill="#232a3a" stroke="none"/>
          <rect x="78" y="184" width="12" height="14" fill="#232a3a" stroke="none"/>

          <!-- right side: exposed steel frame, unfinished -->
          <line x1="150" y1="228" x2="150" y2="100" stroke="#3a4152"/>
          <line x1="230" y1="228" x2="230" y2="70" stroke="#3a4152"/>
          <line x1="150" y1="100" x2="230" y2="70" stroke="#3a4152"/>
          <line x1="150" y1="140" x2="230" y2="112" stroke="#3a4152"/>
          <line x1="150" y1="180" x2="230" y2="154" stroke="#3a4152"/>
          <line x1="150" y1="228" x2="230" y2="196" stroke="#3a4152" opacity="0.6"/>
          <!-- diagonal braces -->
          <line x1="150" y1="228" x2="190" y2="91" stroke="#2b3140"/>
          <line x1="150" y1="180" x2="230" y2="112" stroke="#2b3140" opacity="0.5"/>
        </g>

        <!-- broken/jagged top edge to suggest incomplete build -->
        <path d="M230 70 L242 82 L252 66 L262 84 L270 72" fill="none" stroke="#3a4152" stroke-width="2" stroke-linecap="round"/>

        <!-- crane -->
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <!-- base foot / ballast -->
          <rect x="278" y="221" width="44" height="7" rx="1.5" fill="#2b3140" stroke="#4a5265" stroke-width="1.4"/>

          <!-- lattice mast -->
          <g stroke="#565f74" stroke-width="2.4">
            <line x1="292" y1="221" x2="292" y2="64"/>
            <line x1="308" y1="221" x2="308" y2="64"/>
          </g>
          <g stroke="#3a4152" stroke-width="1.3">
            <line x1="292" y1="221" x2="308" y2="197"/>
            <line x1="308" y1="197" x2="292" y2="173"/>
            <line x1="292" y1="173" x2="308" y2="149"/>
            <line x1="308" y1="149" x2="292" y2="125"/>
            <line x1="292" y1="125" x2="308" y2="101"/>
            <line x1="308" y1="101" x2="292" y2="77"/>
            <line x1="292" y1="77"  x2="308" y2="64"/>
          </g>

          <!-- slewing unit / cab -->
          <rect x="286" y="56" width="30" height="16" rx="2" fill="#1c2130" stroke="#5a6478" stroke-width="1.6"/>
          <rect x="291" y="60" width="8" height="7" fill="#2c3345" stroke="none"/>

          <!-- counter-jib (short back arm) with counterweight -->
          <line x1="286" y1="52" x2="245" y2="52" stroke="#5a6478" stroke-width="2.6"/>
          <line x1="252" y1="52" x2="252" y2="42" stroke="#3a4152" stroke-width="1.6"/>
          <line x1="286" y1="52" x2="252" y2="42" stroke="#3a4152" stroke-width="1.2"/>
          <rect x="243" y="42" width="20" height="14" rx="1.5" fill="#2b3140" stroke="#5a6478" stroke-width="1.4"/>
          <!-- back stay to mast top -->
          <line x1="252" y1="42" x2="301" y2="46" stroke="#3a4152" stroke-width="1.2"/>

          <!-- main jib (long front arm) -->
          <g class="crane-arm">
            <line x1="316" y1="52" x2="398" y2="52" stroke="#5a6478" stroke-width="2.6"/>
            <!-- top support cable from mast apex to jib -->
            <line x1="301" y1="34" x2="398" y2="52" stroke="#3a4152" stroke-width="1.2"/>
            <line x1="301" y1="34" x2="252" y2="42" stroke="#3a4152" stroke-width="1.2"/>
            <line x1="301" y1="34" x2="301" y2="46" stroke="#3a4152" stroke-width="1.6"/>
            <!-- lattice webbing under jib -->
            <line x1="330" y1="52" x2="322" y2="60" stroke="#3a4152" stroke-width="1.1"/>
            <line x1="322" y1="60" x2="314" y2="52" stroke="#3a4152" stroke-width="1.1"/>
            <line x1="352" y1="52" x2="344" y2="60" stroke="#3a4152" stroke-width="1.1"/>
            <line x1="344" y1="60" x2="336" y2="52" stroke="#3a4152" stroke-width="1.1"/>
            <line x1="374" y1="52" x2="366" y2="60" stroke="#3a4152" stroke-width="1.1"/>
            <line x1="366" y1="60" x2="358" y2="52" stroke="#3a4152" stroke-width="1.1"/>
            <line x1="392" y1="52" x2="384" y2="60" stroke="#3a4152" stroke-width="1.1"/>
            <line x1="384" y1="60" x2="380" y2="52" stroke="#3a4152" stroke-width="1.1"/>

            <!-- trolley -->
            <rect x="372" y="49" width="10" height="6" rx="1" fill="#3a4152" stroke="none"/>
            <!-- beacon light at jib tip -->
            <circle class="beacon" cx="398" cy="52" r="3" fill="#f2b13b" stroke="none"/>

            <!-- hook cable + hook + suspended beam -->
            <g class="hook-group">
              <line x1="377" y1="55" x2="377" y2="112" stroke="#4a5265" stroke-width="1.4"/>
              <rect x="357" y="112" width="40" height="9" rx="2" fill="#2b3140" stroke="#4a5265" stroke-width="1.4"/>
            </g>
          </g>
        </g>
      </svg>
    </div>

    <h1>We're currently under maintenance</h1>
    <p>
      Y&nbsp;N&nbsp;Classes is offline for a scheduled update. We're working to
      bring things back online — please check back shortly.
    </p>

    <div class="status-pill">
      <span class="status-dot"></span>
      Maintenance in progress
    </div>
  </div>
  <div class="footer">Y N Classes &middot; Site Maintenance</div>
</body>
</html>
